<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reel — Personal film ledger</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter+Tight:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--ff-body, 'Inter Tight', system-ui, sans-serif);
    background: var(--c-bg, #0f1012);
    color: var(--c-fg, #f4efe6);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background .35s ease, color .35s ease;
  }
  button { font-family: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--c-accent); color: var(--c-bg); }

  .reel {
    min-height: 100vh;
    background: var(--c-bg);
    color: var(--c-fg);
    transition: background .35s ease, color .35s ease;
  }

  /* ── Header ─────────────────────────────────────────────────── */
  .hdr {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 32px;
    background: color-mix(in oklab, var(--c-bg) 82%, transparent);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border-bottom: 1px solid var(--c-line);
  }
  .hdr-l, .hdr-r { display: flex; align-items: center; gap: 18px; }
  .logo { display: flex; align-items: baseline; gap: 6px; font-family: var(--ff-display); font-size: 22px; letter-spacing: -.02em; font-weight: 500; }
  .logo-mark { color: var(--c-accent); font-size: 18px; line-height: 1; }
  .logo-word { font-style: italic; }
  .hdr-nav { display: flex; gap: 4px; margin-left: 12px; }
  .hdr-nav-item {
    padding: 6px 12px; font-size: 13.5px; border-radius: 999px;
    color: var(--c-muted); cursor: pointer; transition: all .15s;
  }
  .hdr-nav-item:hover { color: var(--c-fg); background: var(--c-faint); }
  .hdr-nav-item.active { color: var(--c-fg); background: var(--c-faint); }

  .search {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border: 1px solid var(--c-line); border-radius: 999px;
    background: var(--c-faint); width: 280px;
    transition: all .15s;
  }
  .search:focus-within { border-color: var(--c-accent); }
  .search svg { color: var(--c-muted); flex-shrink: 0; }
  .search input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    color: inherit; font: inherit; font-size: 13.5px;
  }
  .search input::placeholder { color: var(--c-muted); }
  .kbd {
    font-family: var(--ff-mono); font-size: 10.5px; padding: 1px 6px;
    border: 1px solid var(--c-line); border-radius: 4px;
    color: var(--c-muted); background: var(--c-bg);
  }

  .icon-btn {
    width: 36px; height: 36px; border-radius: 999px;
    border: 1px solid var(--c-line); background: var(--c-faint); color: var(--c-fg);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all .15s;
  }
  .icon-btn:hover { background: var(--c-fg); color: var(--c-bg); }

  .primary-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 999px;
    background: var(--c-fg); color: var(--c-bg);
    border: 0; font-size: 13.5px; font-weight: 500; cursor: pointer;
    transition: all .15s;
  }
  .primary-btn:hover { background: var(--c-accent); color: var(--c-bg); }

  /* ── Hero ───────────────────────────────────────────────────── */
  .hero { padding: 56px 32px 28px; max-width: 1480px; margin: 0 auto; }
  .hero-top {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 32px; margin-bottom: 36px;
  }
  .hero-eyebrow {
    font-family: var(--ff-mono); font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--c-muted);
  }
  .hero-stats {
    display: flex; gap: 36px; align-items: flex-start;
  }
  .stat-v {
    font-family: var(--ff-display); font-size: 32px; line-height: 1;
    font-weight: 400; letter-spacing: -.02em;
  }
  .stat-suffix { font-size: 16px; color: var(--c-muted); margin-left: 1px; }
  .stat-l {
    font-family: var(--ff-mono); font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--c-muted); margin-top: 6px;
  }

  .hero-title {
    font-family: var(--ff-display);
    font-size: clamp(48px, 7vw, 96px);
    line-height: .98; letter-spacing: -.035em;
    font-weight: 400;
    margin: 0 0 36px;
    text-wrap: balance;
  }
  .hero-title em { font-style: italic; color: var(--c-accent); }

  .hero-tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--c-line); }
  .tab {
    padding: 12px 4px; margin-right: 22px;
    font-family: var(--ff-body); font-size: 14px; font-weight: 500;
    background: transparent; border: 0; color: var(--c-muted);
    cursor: pointer; position: relative;
    transition: color .15s;
  }
  .tab:hover { color: var(--c-fg); }
  .tab.on { color: var(--c-fg); }
  .tab.on::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: var(--c-accent);
  }

  /* ── Toolbar ────────────────────────────────────────────────── */
  .toolbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 32px 12px;
    max-width: 1480px; margin: 0 auto;
  }
  .tb-count { display: flex; align-items: baseline; gap: 8px; }
  .tb-num {
    font-family: var(--ff-display); font-size: 26px; line-height: 1;
    letter-spacing: -.02em;
  }
  .tb-lbl { font-size: 13px; color: var(--c-muted); }
  .tb-views {
    display: flex; gap: 2px; padding: 3px; border-radius: 8px;
    background: var(--c-faint);
  }
  .tb-view {
    width: 32px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 0; color: var(--c-muted);
    border-radius: 6px; cursor: pointer;
    transition: all .15s;
  }
  .tb-view:hover { color: var(--c-fg); }
  .tb-view.on {
    background: var(--c-bg); color: var(--c-fg);
    box-shadow: 0 1px 2px rgba(0,0,0,.18);
  }

  /* ── Feed ──────────────────────────────────────────────────── */
  .feed {
    padding: 12px 32px 80px;
    max-width: 1480px; margin: 0 auto;
  }

  .feed-grid {
    display: grid; gap: 28px 22px;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  }
  .feed-grid.feed-compact { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 22px 16px; }
  .feed-grid.feed-comfy { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 36px 28px; }

  .feed-list { display: flex; flex-direction: column; }
  .feed-list.feed-compact .row { padding: 10px 0; }
  .feed-list.feed-comfy .row { padding: 22px 0; }

  .feed-wall {
    columns: 5 180px;
    column-gap: 12px;
  }
  .feed-wall.feed-compact { columns: 6 140px; column-gap: 8px; }
  .feed-wall.feed-comfy { columns: 4 220px; column-gap: 18px; }
  .wall-item {
    display: block; width: 100%; margin: 0 0 12px;
    border: 0; padding: 0; background: transparent; cursor: pointer;
    break-inside: avoid;
    transition: transform .25s cubic-bezier(.3,.7,.4,1);
  }
  .wall-item:hover { transform: translateY(-3px); }

  /* ── Card (grid) ───────────────────────────────────────────── */
  .card { display: flex; flex-direction: column; gap: 12px; }
  .card.is-watched .card-poster .poster { opacity: .72; }
  .card-poster {
    position: relative; padding: 0; border: 0; background: transparent;
    cursor: pointer; display: block;
    transition: transform .25s cubic-bezier(.3,.7,.4,1);
  }
  .card-poster:hover { transform: translateY(-4px); }
  .card-poster:hover .card-quick { opacity: 1; transform: translateY(0); }

  .card-quick {
    position: absolute; top: 10px; right: 10px;
    width: 30px; height: 30px; border-radius: 999px;
    background: rgba(0,0,0,.7); color: #fff; border: 0;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; opacity: 0; transform: translateY(-4px);
    transition: all .2s;
    backdrop-filter: blur(8px);
  }
  .card-quick:hover { background: var(--c-accent); color: var(--c-bg); }
  .card.is-watched .card-quick { opacity: 1; background: var(--c-accent); color: var(--c-bg); }

  .watched-badge {
    position: absolute; top: 10px; left: 10px;
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px; border-radius: 999px;
    background: var(--c-accent); color: var(--c-bg);
    font-family: var(--ff-mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase;
    font-weight: 500;
  }

  .card-title {
    font-family: var(--ff-display); font-size: 16px; line-height: 1.2;
    font-weight: 500; letter-spacing: -.01em;
    background: transparent; border: 0; padding: 0; cursor: pointer;
    color: inherit; text-align: left;
  }
  .card-title:hover { color: var(--c-accent); }
  .card-sub {
    display: flex; gap: 6px; align-items: center;
    font-size: 12px; color: var(--c-muted); margin-top: 2px;
  }
  .card-sub .dot { opacity: .5; }
  .card-rating { margin-top: 6px; }

  .feed-compact .card-title { font-size: 14px; }
  .feed-compact .card-sub { font-size: 11px; }
  .feed-comfy .card-title { font-size: 18px; }

  /* ── Row (list) ────────────────────────────────────────────── */
  .row {
    display: grid;
    grid-template-columns: 56px 1fr auto auto auto;
    gap: 20px; align-items: center;
    padding: 16px 0; border-bottom: 1px solid var(--c-line);
    cursor: pointer; transition: background .15s;
  }
  .row:hover { background: var(--c-faint); margin: 0 -16px; padding-left: 16px; padding-right: 16px; border-radius: 8px; border-color: transparent; }
  .row.is-watched .row-poster { opacity: .65; }
  .row-poster { width: 56px; }
  .feed-compact .row { grid-template-columns: 44px 1fr auto auto auto; }
  .feed-compact .row-poster { width: 44px; }
  .feed-comfy .row { grid-template-columns: 72px 1fr auto auto auto; }
  .feed-comfy .row-poster { width: 72px; }

  .row-title {
    font-family: var(--ff-display); font-size: 18px; line-height: 1.15;
    font-weight: 500; letter-spacing: -.01em;
  }
  .row-sub {
    display: flex; gap: 6px; font-size: 12.5px; color: var(--c-muted); margin-top: 2px;
  }
  .row-sub .dot { opacity: .5; }
  .row-tag {
    font-family: var(--ff-display); font-style: italic;
    font-size: 13px; color: var(--c-muted); margin-top: 4px;
  }
  .row-genres { display: flex; gap: 6px; }
  @media (max-width: 900px) {
    .row { grid-template-columns: 56px 1fr auto; }
    .row-genres, .row-rating { display: none; }
    .row-tag { display: none; }
  }
  @media (max-width: 640px) {
    .row { grid-template-columns: 56px 1fr; }
    .row-actions { display: none; }
  }

  .chip {
    font-family: var(--ff-mono); font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase; padding: 4px 8px; border-radius: 999px;
    background: var(--c-faint); color: var(--c-muted);
    border: 1px solid var(--c-line);
  }

  .ghost-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 999px;
    background: transparent; border: 1px solid var(--c-line); color: var(--c-fg);
    font-size: 12.5px; cursor: pointer; transition: all .15s;
  }
  .ghost-btn:hover { background: var(--c-fg); color: var(--c-bg); border-color: var(--c-fg); }
  .row.is-watched .ghost-btn { background: var(--c-accent); color: var(--c-bg); border-color: var(--c-accent); }

  /* ── Drawer ────────────────────────────────────────────────── */
  .scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    opacity: 0; pointer-events: none;
    transition: opacity .25s; z-index: 50;
    backdrop-filter: blur(2px);
  }
  .scrim.on { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw);
    background: var(--c-bg); color: var(--c-fg);
    border-left: 1px solid var(--c-line);
    box-shadow: -20px 0 60px rgba(0,0,0,.4);
    transform: translateX(100%); transition: transform .35s cubic-bezier(.3,.7,.4,1);
    z-index: 51; overflow-y: auto;
  }
  .drawer.on { transform: translateX(0); }
  .drawer-x {
    position: absolute; top: 16px; right: 16px; z-index: 2;
    width: 36px; height: 36px; border-radius: 999px;
    background: rgba(0,0,0,.5); color: #fff; border: 0;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; backdrop-filter: blur(8px);
  }
  .drawer-x:hover { background: rgba(0,0,0,.75); }

  .drawer-poster { padding: 0; }
  .drawer-poster .poster { aspect-ratio: 16/10 !important; border-radius: 0 !important; }

  .drawer-body { padding: 28px 36px 48px; }
  .drawer-eyebrow {
    font-family: var(--ff-mono); font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--c-muted);
  }
  .drawer-title {
    font-family: var(--ff-display);
    font-size: 44px; line-height: 1.02; letter-spacing: -.025em; font-weight: 400;
    margin: 8px 0 12px; text-wrap: balance;
  }
  .drawer-tag {
    font-family: var(--ff-display); font-style: italic;
    font-size: 18px; color: var(--c-muted); line-height: 1.3;
    margin-bottom: 20px;
  }
  .drawer-genres { display: flex; gap: 6px; margin-bottom: 22px; flex-wrap: wrap; }
  .drawer-synopsis {
    font-size: 15px; line-height: 1.55; color: var(--c-fg);
    opacity: .85;
    padding-bottom: 28px; border-bottom: 1px solid var(--c-line);
    text-wrap: pretty;
  }

  .drawer-rate {
    padding: 24px 0; border-bottom: 1px solid var(--c-line);
  }
  .drawer-rate-lbl {
    font-family: var(--ff-mono); font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--c-muted); margin-bottom: 14px;
  }
  .drawer-rate-num {
    margin-top: 10px; font-family: var(--ff-display);
    font-size: 14px; color: var(--c-muted);
  }

  .drawer-actions { display: flex; gap: 10px; margin-top: 24px; }
  .big-btn {
    flex: 1; padding: 14px 20px; border-radius: 10px;
    background: var(--c-fg); color: var(--c-bg);
    border: 0; font-size: 14px; font-weight: 500; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: all .15s;
  }
  .big-btn:hover { background: var(--c-accent); }
  .big-btn.on { background: var(--c-accent); color: var(--c-bg); }
  .big-btn.ghost { background: transparent; color: var(--c-fg); border: 1px solid var(--c-line); }
  .big-btn.ghost:hover { background: var(--c-faint); border-color: var(--c-fg); color: var(--c-fg); }

  /* ── Toast ─────────────────────────────────────────────────── */
  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
    background: var(--c-fg); color: var(--c-bg);
    padding: 10px 18px; border-radius: 999px;
    font-size: 13px; z-index: 100;
    box-shadow: 0 12px 30px rgba(0,0,0,.25);
    animation: toast-in .25s cubic-bezier(.3,.7,.4,1);
  }
  @keyframes toast-in {
    from { transform: translate(-50%, 12px); opacity: 0; }
    to   { transform: translate(-50%, 0); opacity: 1; }
  }

  /* ── Empty ─────────────────────────────────────────────────── */
  .empty {
    grid-column: 1 / -1; padding: 80px 20px; text-align: center;
    color: var(--c-muted);
  }
  .empty-mark {
    font-size: 48px; line-height: 1; opacity: .35; margin-bottom: 12px;
  }
  .empty-msg { font-family: var(--ff-display); font-size: 18px; }

  /* ── Mobile ────────────────────────────────────────────────── */
  @media (max-width: 720px) {
    .hdr { padding: 14px 18px; gap: 12px; }
    .hdr-nav { display: none; }
    .search { width: 160px; }
    .search .kbd { display: none; }
    .hero { padding: 36px 18px 18px; }
    .hero-top { flex-direction: column; gap: 24px; }
    .hero-stats { flex-wrap: wrap; gap: 24px; }
    .stat-v { font-size: 26px; }
    .toolbar { padding: 14px 18px 8px; }
    .feed { padding: 10px 18px 60px; }
    .feed-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 22px 14px; }
    .drawer-body { padding: 22px 22px 36px; }
    .drawer-title { font-size: 32px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="films.jsx"></script>
<script type="text/babel" src="poster.jsx"></script>
<script type="text/babel" src="star-rating.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
