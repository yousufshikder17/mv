# Daily price poll (roadmap M0).
#
# GitHub Actions rather than node-cron: cron is built in, it is free, and it
# needs no server running 24/7. The job is a single script that runs once and
# exits, so nothing here is Actions-specific — the same `npm run poll` works
# under any scheduler if this ever moves.
#
# REQUIRES a database reachable from GitHub's runners. A localhost Postgres is
# not; set DATABASE_URL to a hosted instance before enabling this.
name: Daily price poll

on:
  schedule:
    # 09:15 UTC. Off the hour deliberately — Actions delays jobs scheduled on
    # the hour, when everyone else's cron fires at once.
    - cron: '15 9 * * *'
  workflow_dispatch: {}

concurrency:
  # A slow run must not overlap the next day's. Quotes would still dedupe on
  # the unique constraint, but two concurrent TMDB refresh sweeps would burn
  # rate limit for nothing.
  group: daily-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mv-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mv-backend/package-lock.json

      # --omit=dev deliberately. The poll needs none of the dev tooling, and
      # installing it is what broke this job: vitest pulls esbuild, whose
      # per-platform optional packages are exactly what a lock file drifts on.
      # Skipping them is both faster and one less thing that can fail at 09:15.
      - run: npm ci --omit=dev

      - run: npm run poll
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          # Prices. Without these the job still exits 0 while collecting
          # nothing, which is the failure mode that actually costs something:
          # ITAD backfills game history on demand, Google Books does not, so a
          # day of book prices missed is a permanent hole in the series.
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          GOOGLE_BOOKS_WATCH_IDS: ${{ secrets.GOOGLE_BOOKS_WATCH_IDS }}
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          KINDLE_RSS_URL: ${{ secrets.KINDLE_RSS_URL }}

          # Catalogue refresh. TMDB rows must not age past the six-month cache
          # limit their terms set (SPEC 3), and games refresh through RAWG.
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}

          # Alert delivery. Separate from collection on purpose - a missing
          # mail key costs a notification, never a day of price history.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
